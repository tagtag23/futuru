<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Futuru — Projects</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: system-ui, -apple-system, sans-serif; background: #1a1a1a; color: #f0f0f0; min-height: 100vh; -webkit-font-smoothing: antialiased; }

nav { display: flex; align-items: center; justify-content: space-between; padding: 1.2rem 2rem; border-bottom: 1px solid #2a2a2a; }
.logo { font-size: 1.2rem; font-weight: 700; color: #f0f0f0; text-decoration: none; letter-spacing: -0.02em; }
.nav-links { display: flex; gap: 2rem; }
.nav-links a { font-size: 14px; color: #888; text-decoration: none; transition: color 0.2s; }
.nav-links a:hover { color: #f0f0f0; }
.nav-links a.active { color: #f0f0f0; }

.header { padding: 3rem 2rem 2.5rem; max-width: 900px; margin: 0 auto; }
.header h1 { font-size: 2rem; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 0.4rem; }
.header p { font-size: 0.9rem; color: #888; }

.stats { display: flex; gap: 3rem; margin-top: 2rem; }
.stat-val { font-size: 1.6rem; font-weight: 600; letter-spacing: -0.02em; }
.stat-lbl { font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 0.08em; margin-top: 3px; }

.container { max-width: 900px; margin: 0 auto; padding: 0 2rem 4rem; }

.new-row { display: flex; gap: 8px; margin-bottom: 2.5rem; }
.new-input {
  flex: 1; background: #222; border: 1px solid #333; border-radius: 8px;
  padding: 0.75rem 1rem; font-size: 0.9rem; color: #f0f0f0;
  font-family: system-ui, sans-serif; outline: none; transition: border-color 0.2s;
}
.new-input::placeholder { color: #555; }
.new-input:focus { border-color: #666; }
.btn-add {
  background: #f0f0f0; color: #1a1a1a; border: none; border-radius: 8px;
  padding: 0.75rem 1.3rem; font-size: 0.88rem; font-weight: 600;
  font-family: system-ui, sans-serif; cursor: pointer; white-space: nowrap;
  transition: background 0.15s;
}
.btn-add:hover { background: #ddd; }

.divider { font-size: 11px; color: #555; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 1rem; }

.project-list { display: flex; flex-direction: column; gap: 1px; border: 1px solid #2a2a2a; border-radius: 10px; overflow: hidden; }

.project-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 1.1rem 1.3rem; background: #1e1e1e; cursor: pointer;
  transition: background 0.15s; gap: 1rem;
}
.project-row:hover { background: #242424; }
.project-row + .project-row { border-top: 1px solid #2a2a2a; }

.proj-left { display: flex; align-items: center; gap: 1rem; flex: 1; min-width: 0; }
.proj-name { font-size: 0.95rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.proj-sub { font-size: 12px; color: #666; margin-top: 2px; }

.proj-right { display: flex; align-items: center; gap: 1.5rem; flex-shrink: 0; }
.proj-count { font-size: 12px; color: #666; }
.btn-open {
  background: transparent; border: 1px solid #333; border-radius: 6px;
  padding: 5px 14px; font-size: 12px; font-weight: 600; color: #ccc;
  cursor: pointer; font-family: system-ui, sans-serif; transition: border-color 0.15s, color 0.15s;
}
.btn-open:hover { border-color: #f0f0f0; color: #f0f0f0; }
.btn-del {
  background: none; border: none; color: #444; cursor: pointer; font-size: 13px;
  padding: 4px 6px; border-radius: 5px; transition: color 0.15s;
}
.btn-del:hover { color: #ef4444; }

.empty {
  text-align: center; padding: 4rem 2rem;
  border: 1px dashed #2a2a2a; border-radius: 10px;
  color: #555; font-size: 0.9rem;
}
.empty h3 { font-size: 1rem; color: #666; margin-bottom: 0.4rem; font-weight: 500; }

.toast {
  position: fixed; bottom: 2rem; right: 2rem; background: #2a2a2a;
  color: #f0f0f0; padding: 0.8rem 1.2rem; border-radius: 8px; font-size: 0.88rem;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5); transform: translateY(60px); opacity: 0;
  transition: all 0.2s; z-index: 300; pointer-events: none;
}
.toast.show { transform: translateY(0); opacity: 1; }

footer { text-align: center; padding: 2rem; font-size: 12px; color: #444; border-top: 1px solid #2a2a2a; }
</style>
</head>
<body>

<nav>
  <a href="projects.html" class="logo">Futuru</a>
  <div class="nav-links">
    <a href="projects.html" class="active">Projects</a>
    <a href="mixer.html">Mix Tester</a>
    <a href="optimizer.html">Optimizer</a>
  </div>
</nav>

<div class="header">
  <h1>Projects</h1>
  <p>Select a project to open its mixes and optimizer.</p>
  <div class="stats">
    <div>
      <div class="stat-val" id="stat-projects">0</div>
      <div class="stat-lbl">Projects</div>
    </div>
    <div>
      <div class="stat-val" id="stat-mixes">0</div>
      <div class="stat-lbl">Saved mixes</div>
    </div>
    <div>
      <div class="stat-val" id="stat-last">—</div>
      <div class="stat-lbl">Last saved</div>
    </div>
  </div>
</div>

<div class="container">
  <div class="new-row">
    <input type="text" class="new-input" id="new-input" placeholder="New project name — e.g. Bridge A, Harbour Expansion…" maxlength="80" />
    <button class="btn-add" onclick="createProject()">+ New Project</button>
  </div>
  <div class="divider" id="list-label">All projects</div>
  <div id="project-list"></div>
</div>

<footer>Futuru © 2026 — Built on BOxCrete open source</footer>
<div class="toast" id="toast"></div>

<script>
function load() { try { return JSON.parse(localStorage.getItem('futuru-projects') || '[]'); } catch { return []; } }
function save(p) { localStorage.setItem('futuru-projects', JSON.stringify(p)); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function render() {
  const projects = load();
  const totalMixes = projects.reduce((s,p) => s + (p.mixes||[]).length, 0);
  document.getElementById('stat-projects').textContent = projects.length;
  document.getElementById('stat-mixes').textContent = totalMixes;
  let latest = null;
  projects.forEach(p => (p.mixes||[]).forEach(m => { if (!latest || m.savedAt > latest) latest = m.savedAt; }));
  document.getElementById('stat-last').textContent = latest
    ? new Date(latest).toLocaleDateString('en-GB', {day:'numeric', month:'short'}) : '—';

  document.getElementById('list-label').textContent = projects.length ? `All projects (${projects.length})` : 'All projects';
  const list = document.getElementById('project-list');

  if (!projects.length) {
    list.innerHTML = `<div class="empty"><h3>No projects yet</h3>Type a name above and press + New Project.</div>`;
    return;
  }

  list.innerHTML = `<div class="project-list">${projects.map(p => {
    const mixes = p.mixes || [];
    const last = mixes.length ? new Date(mixes[mixes.length-1].savedAt).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}) : null;
    return `<div class="project-row" onclick="openProject('${p.id}')">
      <div class="proj-left">
        <div>
          <div class="proj-name">${esc(p.name)}</div>
          <div class="proj-sub">${last ? 'Last mix: '+last : 'No mixes yet'}</div>
        </div>
      </div>
      <div class="proj-right">
        <span class="proj-count">${mixes.length} mix${mixes.length!==1?'es':''}</span>
        <button class="btn-open" onclick="event.stopPropagation();openProject('${p.id}')">Open →</button>
        <button class="btn-del" onclick="event.stopPropagation();deleteProject('${p.id}')" title="Delete">✕</button>
      </div>
    </div>`;
  }).join('')}</div>`;
}

function openProject(id) { window.location.href = 'project.html?id=' + id; }

function createProject() {
  const input = document.getElementById('new-input');
  const name = input.value.trim();
  if (!name) { input.focus(); return; }
  const projects = load();
  if (projects.find(p => p.name.toLowerCase() === name.toLowerCase())) { showToast('Project name already exists.'); return; }
  const p = { id: uid(), name, mixes: [], createdAt: new Date().toISOString() };
  projects.unshift(p);
  save(projects);
  input.value = '';
  render();
  showToast('Project "' + name + '" created');
  setTimeout(() => openProject(p.id), 500);
}

function deleteProject(id) {
  const projects = load();
  const p = projects.find(x => x.id === id);
  if (!p || !confirm(`Delete "${p.name}" and all its mixes?`)) return;
  save(projects.filter(x => x.id !== id));
  render();
  showToast('Project deleted.');
}

document.getElementById('new-input').addEventListener('keydown', e => { if (e.key === 'Enter') createProject(); });

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

render();
</script>
</body>
</html>
