<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Futuru — Batch Analyzer</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #f5f5f0; color: #1a1a1a; }
    nav { display: flex; align-items: center; justify-content: space-between; padding: 1.2rem 2rem; background: #1a1a1a; }
    nav .logo { font-size: 1.3rem; font-weight: 600; color: white; text-decoration: none; }
    nav .back { color: #aaa; font-size: 14px; text-decoration: none; }
    nav .back:hover { color: white; }
    .container { max-width: 960px; margin: 2rem auto; padding: 0 1.5rem; }
    .card { background: white; border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; border: 1px solid #e5e5e5; }
    .card-title { font-size: 11px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 1.2rem; }
    .top-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .top-row input, .top-row select { padding: 8px 10px; border: 1px solid #e5e5e5; border-radius: 8px; font-size: 13px; width: 100%; }
    .top-row input:focus, .top-row select:focus { outline: none; border-color: #1a1a1a; }
    .add-row { display: grid; grid-template-columns: repeat(7, 1fr) auto; gap: 8px; align-items: end; }
    .add-row input { padding: 8px 10px; border: 1px solid #e5e5e5; border-radius: 8px; font-size: 13px; width: 100%; }
    .add-row input:focus { outline: none; border-color: #1a1a1a; }
    .field-label { font-size: 11px; color: #888; margin-bottom: 4px; }
    .add-btn { padding: 8px 16px; background: #1a1a1a; color: white; border: none; border-radius: 8px; font-size: 13px; cursor: pointer; white-space: nowrap; }
    .add-btn:hover { background: #333; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 8px 10px; border-bottom: 1px solid #e5e5e5; font-size: 11px; color: #888; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
    td { padding: 10px; border-bottom: 1px solid #f5f5f5; }
    tr:last-child td { border-bottom: none; }
    .strength-badge { display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; }
    .badge-green { background: #dcfce7; color: #15803d; }
    .badge-yellow { background: #fef9c3; color: #854d0e; }
    .badge-red { background: #fee2e2; color: #991b1b; }
    .loc-tag { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; }
    .loc-indoor { background: #f3f4f6; color: #374151; }
    .loc-outdoor { background: #e0f2fe; color: #0369a1; }
    .delete-btn { background: none; border: none; color: #ccc; cursor: pointer; font-size: 16px; }
    .delete-btn:hover { color: #ef4444; }
    .empty-state { text-align: center; padding: 2rem; color: #aaa; font-size: 14px; }
    .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
    .summary-card { background: #fafafa; border: 1px solid #e5e5e5; border-radius: 8px; padding: 1rem; text-align: center; }
    .summary-card .s-num { font-size: 1.6rem; font-weight: 600; color: #1a1a1a; }
    .summary-card .s-lbl { font-size: 12px; color: #888; margin-top: 4px; }
    .summary-card.best .s-num { color: #16a34a; }
    footer { text-align: center; padding: 2rem; font-size: 12px; color: #aaa; }
  </style>
</head>
<body>

<nav>
  <a href="projects.html" class="logo">Futuru</a>
  <a href="projects.html" class="back">← Projects</a>
</nav>

<div class="container">

  <div class="card">
    <p class="card-title">Add a mix</p>
    <div class="top-row">
      <div>
        <div class="field-label">Mix name</div>
        <input type="text" id="mix-name" placeholder="e.g. Mix A, Trial 1">
      </div>
      <div>
        <div class="field-label">Location</div>
        <select id="mix-location">
          <option value="indoor">Indoors</option>
          <option value="outdoor">Outdoors</option>
        </select>
      </div>
      <div>
        <div class="field-label">Plant</div>
        <select id="mix-plant">
          <option value="reykjavik">Reykjavík</option>
          <option value="akranes">Akranes</option>
        </select>
      </div>
    </div>
    <div class="add-row">
      <div><div class="field-label">Cement (kg)</div><input type="number" id="f-cement" value="350" min="150" max="450"></div>
      <div><div class="field-label">Water (kg)</div><input type="number" id="f-water" value="175" min="120" max="220"></div>
      <div><div class="field-label">Fine agg.</div><input type="number" id="f-fine" value="750" min="600" max="900"></div>
      <div><div class="field-label">Coarse agg.</div><input type="number" id="f-coarse" value="950" min="800" max="1100"></div>
      <div><div class="field-label">Fly ash (kg)</div><input type="number" id="f-flyash" value="50" min="0" max="200"></div>
      <div><div class="field-label">Superpl. (kg)</div><input type="number" id="f-sp" value="5" min="0" max="20"></div>
      <div><div class="field-label">Age (days)</div><input type="number" id="f-age" value="28" min="7" max="90"></div>
      <button class="add-btn" onclick="addMix()">Add →</button>
    </div>
  </div>

  <div class="card" id="summary-card" style="display:none;">
    <p class="card-title">Summary</p>
    <div class="summary-grid" id="summary-grid"></div>
  </div>

  <div class="card" id="chart-card" style="display:none;">
    <p class="card-title">Strength comparison</p>
    <div style="position:relative;height:280px;">
      <canvas id="chart"></canvas>
    </div>
  </div>

  <div class="card">
    <p class="card-title">Mix results</p>
    <div id="table-container">
      <div class="empty-state">No mixes added yet — add your first mix above!</div>
    </div>
  </div>

</div>

<footer>Futuru © 2026 — Built on BOxCrete open source</footer>

<script>
let mixes = [];

const MIXES_DB = {
  indoor: [
    { strength: 'C35/45', exposure: 'XC3/XD1', minMpa: 35 },
    { strength: 'C50/60', exposure: 'XC4', minMpa: 50 }
  ],
  outdoor: [
    { strength: 'C25/30', exposure: 'XF1/XF2', minMpa: 25 },
    { strength: 'C30/37', exposure: 'XF3', minMpa: 30 },
    { strength: 'C35/45', exposure: 'XF4', minMpa: 35 },
    { strength: 'C40/50', exposure: 'XF4', minMpa: 40 }
  ]
};

function predict(cement, water, fine, coarse, flyash, sp, age) {
  const wc = water / (cement + 0.5 * flyash + 1e-6);
  const binder = cement + 0.8 * flyash;
  const s = 0.35*binder - 25.0*wc + 0.008*fine*0.1 + 0.005*coarse*0.1 + 2.5*sp + 0.18*age - 10.0;
  return Math.max(s, 0);
}

function getCertifiedClass(mpa, location) {
  let match = null;
  for (const m of MIXES_DB[location]) {
    if (mpa >= m.minMpa) match = m;
  }
  return match;
}

function addMix() {
  const name = document.getElementById('mix-name').value || ('Mix ' + (mixes.length + 1));
  const location = document.getElementById('mix-location').value;
  const plant = document.getElementById('mix-plant').value;
  const cement = parseFloat(document.getElementById('f-cement').value);
  const water = parseFloat(document.getElementById('f-water').value);
  const fine = parseFloat(document.getElementById('f-fine').value);
  const coarse = parseFloat(document.getElementById('f-coarse').value);
  const flyash = parseFloat(document.getElementById('f-flyash').value);
  const sp = parseFloat(document.getElementById('f-sp').value);
  const age = parseFloat(document.getElementById('f-age').value);
  const mpa = predict(cement, water, fine, coarse, flyash, sp, age);
  const wc = water / cement;
  const certClass = getCertifiedClass(mpa, location);

  mixes.push({ name, location, plant, cement, water, fine, coarse, flyash, sp, age, mpa, wc, certClass });
  document.getElementById('mix-name').value = '';
  render();
}

function deleteMix(i) {
  mixes.splice(i, 1);
  render();
}

let chartInstance = null;

function render() {
  const container = document.getElementById('table-container');
  document.getElementById('summary-card').style.display = mixes.length ? 'block' : 'none';
  document.getElementById('chart-card').style.display = mixes.length ? 'block' : 'none';

  if (mixes.length === 0) {
    container.innerHTML = '<div class="empty-state">No mixes added yet — add your first mix above!</div>';
    return;
  }

  const bestMpa = Math.max(...mixes.map(m => m.mpa));
  const avgMpa = mixes.reduce((a, m) => a + m.mpa, 0) / mixes.length;
  const bestMix = mixes.find(m => m.mpa === bestMpa);

  document.getElementById('summary-grid').innerHTML = `
    <div class="summary-card"><div class="s-num">${mixes.length}</div><div class="s-lbl">Mixes tested</div></div>
    <div class="summary-card best"><div class="s-num">${bestMpa.toFixed(1)}</div><div class="s-lbl">Best strength (MPa)</div></div>
    <div class="summary-card"><div class="s-num">${avgMpa.toFixed(1)}</div><div class="s-lbl">Average (MPa)</div></div>
    <div class="summary-card"><div class="s-num">${bestMix.certClass ? bestMix.certClass.strength : '—'}</div><div class="s-lbl">Best certified class</div></div>
  `;

  container.innerHTML = `
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Location</th>
          <th>Strength</th>
          <th>Certified class</th>
          <th>Exposure</th>
          <th>W/C</th>
          <th>Cement</th>
          <th>Water</th>
          <th>Age</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        ${mixes.map((m, i) => {
          const isBest = m.mpa === bestMpa;
          const badgeClass = isBest ? 'badge-green' : m.mpa >= 30 ? 'badge-yellow' : 'badge-red';
          return `<tr>
            <td><strong>${m.name}</strong>${isBest ? ' <span style="font-size:11px;color:#16a34a;">★</span>' : ''}</td>
            <td><span class="loc-tag ${m.location === 'indoor' ? 'loc-indoor' : 'loc-outdoor'}">${m.location === 'indoor' ? 'Indoors' : 'Outdoors'}</span></td>
            <td><span class="strength-badge ${badgeClass}">${m.mpa.toFixed(1)} MPa</span></td>
            <td>${m.certClass ? m.certClass.strength : '—'}</td>
            <td>${m.certClass ? m.certClass.exposure : '—'}</td>
            <td>${m.wc.toFixed(2)}</td>
            <td>${m.cement.toFixed(0)} kg</td>
            <td>${m.water.toFixed(0)} kg</td>
            <td>${m.age.toFixed(0)} days</td>
            <td><button class="delete-btn" onclick="deleteMix(${i})">✕</button></td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  `;

  if (chartInstance) chartInstance.destroy();
  chartInstance = new Chart(document.getElementById('chart'), {
    type: 'bar',
    data: {
      labels: mixes.map(m => m.name),
      datasets: [{
        label: 'Strength (MPa)',
        data: mixes.map(m => parseFloat(m.mpa.toFixed(1))),
        backgroundColor: mixes.map(m => m.location === 'indoor' ? '#1a1a1a' : '#0369a1'),
        borderRadius: 6
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        y: { title: { display: true, text: 'MPa' }, min: 0 },
        x: { ticks: { autoSkip: false } }
      }
    }
  });
}
</script>
</body>
</html>
